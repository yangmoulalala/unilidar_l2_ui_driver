[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unilidar-l2"
version = "1.0.0"
description = "Unitree L2 LiDAR MAVLink protocol library and point cloud viewer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
gui = ["PySide6>=6.4"]

[project.scripts]
unilidar-l2 = "unilidar_l2.__main__:main"

[tool.setuptools]
packages = ["unilidar_l2"]
